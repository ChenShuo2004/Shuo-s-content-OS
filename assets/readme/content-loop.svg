<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="&#x68;ttp://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shuo's content OS 内容判断校准闭环</title>
  <desc id="desc">A warm minimal animated workflow diagram showing idea, draft, scoring, blind prediction, publish, retro, and rubric update as a continuous content calibration loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="0.54" stop-color="#F7FBF7"/>
      <stop offset="1" stop-color="#F4FAFF"/>
    </linearGradient>
    <linearGradient id="line" x1="198" y1="256" x2="1006" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0A84B"/>
      <stop offset="0.5" stop-color="#55A391"/>
      <stop offset="1" stop-color="#4A7BA7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2F3A45" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2933; }
      .subtitle { font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5B6773; }
      .label { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26323D; }
      .small { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6C7782; }
      .card { fill: rgba(255,255,255,0.86); stroke: rgba(75,91,105,0.12); stroke-width: 1; }
      .node { fill: #FFFFFF; stroke: rgba(59,74,88,0.14); stroke-width: 1.2; }
      .dot { filter: drop-shadow(0 6px 10px rgba(74,123,167,0.25)); }
      @media (prefers-reduced-motion: reduce) {
        animate, animateMotion, animateTransform { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="164" cy="98" r="76" fill="#F2C76E" opacity="0.16"/>
  <circle cx="1036" cy="416" r="96" fill="#7FB8AA" opacity="0.14"/>
  <circle cx="925" cy="86" r="54" fill="#6FA0C9" opacity="0.12"/>

  <g filter="url(#softShadow)">
    <rect x="72" y="54" width="1056" height="412" rx="28" class="card"/>
  </g>

  <text x="600" y="122" text-anchor="middle" class="title">内容判断校准闭环</text>
  <text x="600" y="156" text-anchor="middle" class="subtitle">先预测，再发布，用复盘把创作经验沉淀成系统能力</text>

  <path id="loopPath" d="M205 274 C270 194 382 183 456 232 C516 272 526 344 600 344 C674 344 684 272 744 232 C818 183 930 194 995 274 C940 366 806 396 703 344 C648 316 552 316 497 344 C394 396 260 366 205 274Z" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>
  <path d="M205 274 C270 194 382 183 456 232 C516 272 526 344 600 344 C674 344 684 272 744 232 C818 183 930 194 995 274 C940 366 806 396 703 344 C648 316 552 316 497 344 C394 396 260 366 205 274Z" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <circle r="9" fill="#2F7F74" class="dot">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#D79A2B" opacity="0.88" class="dot">
    <animateMotion dur="8s" begin="-2.7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#4A7BA7" opacity="0.78" class="dot">
    <animateMotion dur="8s" begin="-5.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>

  <g transform="translate(140 222)">
    <rect width="118" height="76" rx="18" class="node"/>
    <text x="59" y="35" text-anchor="middle" class="label">选题</text>
    <text x="59" y="56" text-anchor="middle" class="small">Idea</text>
  </g>

  <g transform="translate(297 178)">
    <rect width="118" height="76" rx="18" class="node"/>
    <text x="59" y="35" text-anchor="middle" class="label">草稿</text>
    <text x="59" y="56" text-anchor="middle" class="small">Draft</text>
  </g>

  <g transform="translate(482 194)">
    <rect width="118" height="76" rx="18" class="node"/>
    <text x="59" y="35" text-anchor="middle" class="label">评分</text>
    <text x="59" y="56" text-anchor="middle" class="small">Score</text>
  </g>

  <g transform="translate(600 310)">
    <rect width="146" height="82" rx="20" class="node"/>
    <text x="73" y="37" text-anchor="middle" class="label">盲预测</text>
    <text x="73" y="59" text-anchor="middle" class="small">Before data</text>
  </g>

  <g transform="translate(765 194)">
    <rect width="118" height="76" rx="18" class="node"/>
    <text x="59" y="35" text-anchor="middle" class="label">发布</text>
    <text x="59" y="56" text-anchor="middle" class="small">Publish</text>
  </g>

  <g transform="translate(942 222)">
    <rect width="118" height="76" rx="18" class="node"/>
    <text x="59" y="35" text-anchor="middle" class="label">复盘</text>
    <text x="59" y="56" text-anchor="middle" class="small">Retro</text>
  </g>

  <g transform="translate(468 394)">
    <rect width="264" height="46" rx="23" fill="#26323D" opacity="0.94"/>
    <text x="132" y="30" text-anchor="middle" style="font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #FFFFFF;">更新 Rubric，让判断变准</text>
    <animateTransform attributeName="transform" type="translate" values="468 394;468 390;468 394" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.78">
    <path d="M285 404H154C134 404 118 388 118 368V330" stroke="#D8B66C" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M915 404H1046C1066 404 1082 388 1082 368V330" stroke="#79AFC0" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
